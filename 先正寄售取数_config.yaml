# ============================================================
# 2. 集团分组映射
# ============================================================
# scope: both     = 收到场景和开票场景都计入该分组
#        received = 仅收到场景计入
#        invoiced = 仅开票场景计入
# 业务规则：
#   - 重庆海尔：收到只算物流公司（调拨单为准），开票算物流+空调器
#   - 佳世达：收到只算电通公司（调拨单为准），开票算电通+电子
# ============================================================
group_mapping:
  - group_name: "海信"
    members:
      - name: "海信容声（扬州）冰箱有限公司"
        scope: "both"
      - name: "海信冰箱有限公司"
        scope: "both"
      - name: "海信容声（广东）冷柜有限公司"
        scope: "both"
      - name: "海信容声（广东）冰箱有限公司"
        scope: "both"
      - name: "海信（成都）冰箱有限公司"
        scope: "both"

  - group_name: "重庆海尔"
    members:
      - name: "重庆海尔物流有限公司"
        scope: "both"
      - name: "重庆海尔空调器有限公司"
        scope: "invoiced"

  - group_name: "武汉美的"
    members:
      - name: "美的集团武汉制冷设备有限公司"
        scope: "both"
      - name: "美的集团武汉暖通设备有限公司"
        scope: "both"

  - group_name: "佳世达"
    members:
      - name: "苏州佳世达电通有限公司"
        scope: "both"
      - name: "苏州佳世达电子有限公司"
        scope: "invoiced"

  - group_name: "比亚迪"
    members:
      - name: "比亚迪汽车工业有限公司"
        scope: "both"
      - name: "抚州比亚迪实业有限公司"
        scope: "both"
      - name: "广西东盟弗迪电池有限公司"
        scope: "both"
      - name: "广西弗迪电池有限公司"
        scope: "both"
      - name: "宁波弗迪电池有限公司"
        scope: "both"
      - name: "汕尾比亚迪汽车有限公司"
        scope: "both"
      - name: "绍兴弗迪电池有限公司"
        scope: "both"
      - name: "深圳比亚迪汽车实业有限公司"
        scope: "both"
      - name: "深圳市比亚迪供应链管理有限公司"
        scope: "both"
      - name: "西安比亚迪汽车零部件有限公司"
        scope: "both"
      - name: "长沙市比亚迪汽车有限公司"
