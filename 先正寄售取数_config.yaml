# 3. 开票规则
# ============================================================
invoice_rules:
  # 特殊开票备注客户：必须满足特定备注才计入开票汇总
  special_memo_customers:
    - name: "南京国电南自电网自动化有限公司"
      memos:
        - "开发货单专用"
        - "销账 寄售"

  # 开票汇总排除清单：这些客户不参与通用开票汇总（有单独规则）
  summary_exclude_customers:
    - "青岛海达源采购服务有限公司"
    - "青岛海尔零部件采购有限公司"
    - "佛山市顺德海尔智能电子有限公司"
    - "重庆海尔空调器有限公司"

# ============================================================
# 4. 二维码读入客户
# ============================================================
# 这些客户的客户料号通过扫码读入到 cdefine31 字段
# 字段映射：cdefine31（扫码）→ 客户料号，空值回退到 cCusInvCode
# ============================================================
qrcode_customers:
  enabled: true
  scan_field: "cdefine31"
  fallback_field: "cCusInvCode"
  customers:
    - "佛山市顺德海尔智能电子有限公司"
    - "青岛海尔零部件采购有限公司"
    - "青岛海达源采购服务有限公司"
    - "重庆海尔空调器有限公司"
    - "重庆海尔物流有限公司"
    - "四川长虹电器股份有限公司"
    - "杭州松下家用电器有限公司"

