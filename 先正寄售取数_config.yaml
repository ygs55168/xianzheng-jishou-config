meta:
  version: "0630"                  # 表版本号后缀（如 0630=6月30日版本）
  period_full: "2026-06"           # 完整期间格式（用于开票筛选）
  period_short: "2026-6"           # 短期间格式（用于收到筛选）
  date_start: "2026-06-01"         # 开始日期
  date_end: "2026-06-30"           # 结束日期
  consign_flag_field: "ccusdefine2"  # 客户档案寄售标识字段
  consign_flag_value: "T"          # 寄售标识值
  cust_item_no_expr: "ISNULL(NULLIF(sls.cdefine28, ''), sls.cCusInvCode)"  # 客户料号取值表达式

